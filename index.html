<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Giorgio Antonelli - Full Stack & Social Media Recruiter"
  >

  <title>Giorgio Antonelli | Full Stack & Social Media Recruiter</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #24292f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      line-height: 1.6;
    }

    a {
      color: #0969da;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img {
      max-width: 100%;
    }

    /* =========================
       MAIN CONTAINER
       ========================= */

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 30px 80px;
    }

    /* =========================
       HERO
       ========================= */

    .hero {
      text-align: center;
      padding: 20px 0 45px;
    }

    .hero-logo {
      display: block;
      width: 100%;
      max-width: 1100px;
      height: auto;
      margin: 0 auto 30px;
      border-radius: 8px;
    }

    .hero h1 {
      margin: 20px 0 15px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.2;
      color: #24292f;
    }

    .typing {
      display: inline-block;
      max-width: 100%;
    }

    .typing img {
      width: 600px;
      max-width: 100%;
      height: auto;
    }

    .contact-title {
      margin-top: 35px;
      margin-bottom: 18px;
      font-size: 1.25rem;
    }

    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .social-buttons img {
      height: 28px;
      width: auto;
    }

    /* =========================
       SECTIONS
       ========================= */

    .section {
      border-top: 1px solid #d8dee4;
      margin-top: 40px;
      padding-top: 40px;
    }

    .section h2 {
      font-size: 1.9rem;
      margin: 0 0 25px;
      color: #24292f;
    }

    .section h3 {
      margin-top: 25px;
      margin-bottom: 12px;
      color: #24292f;
    }

    /* =========================
       ABOUT
       ========================= */

    .about-text {
      font-size: 1.05rem;
    }

    .approach {
      margin-top: 25px;
    }

    .approach li {
      margin-bottom: 10px;
    }

    /* =========================
       INTERESTS
       ========================= */

    .interest-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 25px;
      margin-top: 25px;
    }

    .interest-card {
      border: 1px solid #d8dee4;
      border-radius: 12px;
      padding: 25px;
      background: #f6f8fa;
    }

    .interest-card h3 {
      margin-top: 0;
    }

    .interest-card p {
      margin-bottom: 15px;
    }

    .badge-link img {
      max-width: 100%;
    }

    .publication {
      margin-top: 30px;
    }

       JOB DASHBOARD
       ================
